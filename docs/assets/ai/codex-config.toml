# Codex settings for a lab project. Save as .codex/config.toml in the repository
# (or add the lines to ~/.codex/config.toml to use them everywhere).

# Codex asks for your approval before it runs a command outside the sandbox below.
approval_policy = "on-request"

# Codex may edit files only inside the project folder.
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# No internet access for the commands Codex runs.
network_access = false
