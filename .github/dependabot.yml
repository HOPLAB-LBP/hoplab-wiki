# Dependabot keeps the actions used by the workflows up to date. Once a
# month it opens at most one pull request that updates all of them together;
# the PR checks run on it and a reviewer merges it like any other.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "Update workflow actions"
