name: Automation tests

# Pull requests get the same tests and actionlint in "PR checks". This
# workflow is the safety net for what lands on main.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".markdownlint-cli2.yaml"
      - ".yamllint.yml"
      - ".lychee.toml"
      - "_typos.toml"
  workflow_dispatch:

concurrency:
  group: "automation-tests-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      automation: ${{ steps.filter.outputs.automation }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflow:
              - ".github/workflows/*.yml"
              - ".github/workflows/*.yaml"
            automation:
              - "scripts/**"
              - "tests/**"
              - "requirements.txt"
              - ".markdownlint-cli2.yaml"
              - ".yamllint.yml"
              - ".lychee.toml"
              - "_typos.toml"

  custom-tests:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.automation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run MkDocs syntax tests
        run: bash tests/test_check_mkdocs_syntax.sh

      - name: Run markdown table autofix tests
        run: bash tests/test_fix_markdown_table_pipes.sh

      - name: Run link fixer tests
        run: bash tests/test_fix_links.sh

      - name: Run docs tag automation tests
        run: node tests/test-manage-docs-tags.js

  workflow-lint:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
