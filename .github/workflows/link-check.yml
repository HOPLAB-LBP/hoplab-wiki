name: Weekly link check

# Links on the live wiki can break after their page was merged. This checks
# every page once a week and keeps one issue with the broken links: it opens
# or updates the issue when links fail, and closes it when they work again.
# It also removes the previews of pull requests that are no longer open.

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The next step reads lychee's report and decides about the issue;
      # continue-on-error keeps it running if the action itself fails.
      - name: Check links
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config .lychee.toml --format markdown README.md docs/**/*.md
          output: ${{ runner.temp }}/links.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open, update or close the link issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPORT: ${{ runner.temp }}/links.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LABEL="link-check"
          gh api "repos/$REPO/labels" -f name="$LABEL" -f color="d93f0b" \
            -f description="Broken links found by the weekly link check" > /dev/null 2>&1 || true
          NUM=$(gh api "repos/$REPO/issues?labels=$LABEL&state=open" --jq '.[0].number // empty')

          if [ ! -s "$REPORT" ]; then
            echo "::error::lychee wrote no report; see the 'Check links' step."
            exit 1
          fi
          # Only real errors open the issue: a site that is slow once
          # (a timeout) is not worth a weekly issue.
          ERRORS=$(grep -oP 'Errors\s*\|\s*\K[0-9]+' "$REPORT" | head -1)
          echo "Errors: ${ERRORS:-unknown}"

          if [ "${ERRORS:-1}" = "0" ]; then
            if [ -n "$NUM" ]; then
              gh api -X POST "repos/$REPO/issues/$NUM/comments" \
                -f body="All links work again ([run]($RUN_URL)). Closing." > /dev/null
              gh api -X PATCH "repos/$REPO/issues/$NUM" -f state=closed > /dev/null
            fi
            echo "No broken links."
            exit 0
          fi

          BODY="$RUNNER_TEMP/issue.md"
          {
            echo "The weekly link check found links that do not open ([run]($RUN_URL))."
            echo
            echo "Some sites block automated checks: open each link in your browser before changing it. A link that works but keeps failing can go under \`exclude\` in \`.lychee.toml\`, with a comment saying why."
            echo
            echo "This issue is updated every Monday and closed automatically once all links work."
            echo
            head -c 60000 "$REPORT"
          } > "$BODY"

          if [ -n "$NUM" ]; then
            gh api -X PATCH "repos/$REPO/issues/$NUM" -F body=@"$BODY" > /dev/null
            echo "Updated issue #$NUM."
          else
            gh api -X POST "repos/$REPO/issues" -f title="Broken links on the wiki" \
              -F body=@"$BODY" -f "labels[]=$LABEL" -f "assignees[]=costantinoai" > /dev/null
            echo "Opened a new issue."
          fi

  # pr-preview-remove.yml deletes a preview when its pull request closes. If
  # that run failed, the folder would stay online: this removes the previews
  # of every pull request that is no longer open.
  stale-previews:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Remove previews of closed pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -d pr-preview ]; then
            echo "No previews."
            exit 0
          fi
          # A folder stays unless GitHub says its pull request is closed; if
          # GitHub cannot answer, the run fails so someone looks at it.
          pr_state() {
            gh api "repos/$REPO/pulls/$1" --jq .state
          }
          STALE=""
          for DIR in pr-preview/*/; do
            NAME="$(basename "$DIR")"
            NUM="${NAME#pr-}"
            case "$NAME" in pr-*) ;; *) echo "::warning::Unexpected folder pr-preview/$NAME left alone."; continue ;; esac
            case "$NUM" in ''|*[!0-9]*) echo "::warning::Unexpected folder pr-preview/$NAME left alone."; continue ;; esac
            STATE=$(pr_state "$NUM")
            if [ "$STATE" = "closed" ]; then
              STALE="$STALE $NUM"
            fi
          done
          if [ -z "$STALE" ]; then
            echo "Every preview belongs to an open pull request."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Delete, then push; if a deploy or a preview pushed meanwhile, start
          # again from the new gh-pages. Each round checks the state again, so a
          # pull request reopened in between keeps its preview.
          for TRY in 1 2 3; do
            git fetch -q origin gh-pages
            git reset -q --hard origin/gh-pages
            REMOVED=""
            for NUM in $STALE; do
              if [ -d "pr-preview/pr-$NUM" ] && [ "$(pr_state "$NUM")" = "closed" ]; then
                git rm -rq "pr-preview/pr-$NUM"
                REMOVED="$REMOVED #$NUM"
              fi
            done
            if [ -z "$REMOVED" ]; then
              echo "Nothing left to remove."
              exit 0
            fi
            git commit -qm "Remove previews of closed pull requests:$REMOVED"
            if git push -q origin HEAD:gh-pages; then
              echo "Removed the previews of$REMOVED."
              exit 0
            fi
            echo "Push attempt $TRY failed; trying again from the new gh-pages."
          done
          echo "::error::Could not remove the stale previews after 3 attempts."
          exit 1
