name: Post PR check report

# Posts the check report as a PR comment. Runs via workflow_run so it has
# write permissions even when the triggering PR comes from a fork.

on:
  workflow_run:
    workflows: ["PR checks"]
    # requested/in_progress: a (re-)run started — delete the stale comment
    # so an outdated report never lingers while checks run. 'requested'
    # does not fire for re-runs and 'in_progress' does, so both are needed.
    # completed: post the fresh report.
    types: [requested, in_progress, completed]

permissions:
  pull-requests: write

# One report job at a time per PR branch, in event order, so an older run
# cannot overwrite the report of a newer one.
concurrency:
  group: "pr-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}"
  cancel-in-progress: false

jobs:
  delete-stale-comment:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.action != 'completed'
    steps:
      # The report artifact does not exist yet at run start, so resolve the
      # PR number from the head repo/branch instead (works for fork PRs,
      # where workflow_run.pull_requests is empty).
      - name: Find PR for this run
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          PR=$(gh api -X GET "/repos/${{ github.repository }}/pulls" \
            -f head="$HEAD_OWNER:$HEAD_BRANCH" -f state=open \
            --jq '.[0].number // empty')
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"

      - name: Find existing bot comment
        if: steps.pr.outputs.pr_number != ''
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ steps.pr.outputs.pr_number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- pr-checks-report -->"

      - name: Delete stale comment
        if: steps.find-comment.outputs.comment-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE \
            "/repos/${{ github.repository }}/issues/comments/${{ steps.find-comment.outputs.comment-id }}"

  post-comment:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.action == 'completed' &&
      github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v7
        with:
          name: pr-check-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The artifact comes from the PR's own run, so its PR number is not
      # trusted: resolve the PR from the run's head repo/branch (as above) and
      # post only when both agree.
      - name: Read and verify PR number
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          CLAIMED=$(head -c 20 pr-number.txt | tr -cd '0-9')
          ACTUAL=$(gh api -X GET "/repos/${{ github.repository }}/pulls" \
            -f head="$HEAD_OWNER:$HEAD_BRANCH" -f state=open \
            --jq '.[0].number // empty')
          if [ -z "$ACTUAL" ]; then
            echo "::notice::No open PR for $HEAD_OWNER:$HEAD_BRANCH; nothing to post."
            exit 0
          fi
          if [ "$CLAIMED" != "$ACTUAL" ]; then
            echo "::error::Report artifact names PR #$CLAIMED, but this run belongs to PR #$ACTUAL. Not posting."
            exit 1
          fi
          echo "pr_number=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Find existing bot comment
        if: steps.meta.outputs.pr_number != ''
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ steps.meta.outputs.pr_number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- pr-checks-report -->"

      - name: Post or update PR comment
        if: steps.meta.outputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ steps.meta.outputs.pr_number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body-path: report.md
