name: PR checks

# Runs on every pull request: check-and-report is a required check, so a
# pull request without it could never be merged.
on:
  pull_request:

concurrency:
  group: "pr-checks-${{ github.event.pull_request.number || github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────
  #  Job 1: Run all checks and write the report
  # ───────────────────────────────────────────────────────────
  check-and-report:
    runs-on: ubuntu-latest
    # This job runs code from the pull request, so it gets a read-only token.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # "true" when the site built and was uploaded for the preview job.
      preview: ${{ steps.preview_site.outcome == 'success' }}
      # passed or failed: a failed build removes an older preview.
      build: ${{ steps.mkdocs.outputs.status }}
    env:
      # Previews only for branches of this repository: fork PRs and Dependabot
      # get a read-only token, which cannot push to gh-pages.
      PREVIEW_ALLOWED: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # No ref: checks out the PR merge commit, which exists in the
          # base repo even for fork PRs (and tests the merged result).
          fetch-depth: 0
          persist-credentials: false

      - name: Detect automation-related changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            workflow:
              - ".github/workflows/*.yml"
              - ".github/workflows/*.yaml"
            automation:
              - "scripts/**"
              - "tests/**"
              - "requirements.txt"
              - ".markdownlint-cli2.yaml"
              - ".yamllint.yml"
              - ".lychee.toml"
              - "_typos.toml"

      # ── Setup ─────────────────────────────────────────────
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Create results directory
        run: mkdir -p /tmp/pr-checks

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt yamllint

      - name: Prepare generated docs
        run: bash scripts/prepare_docs.sh

      # ── Check 1: Spell check ─────────────────────────────
      - name: Install typos
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          rm -rf "$RUNNER_TEMP/typos-extract"
          mkdir -p "$RUNNER_TEMP/typos-extract"
          TYPOS_VERSION="v1.43.5"
          curl -fsSL "https://github.com/crate-ci/typos/releases/download/${TYPOS_VERSION}/typos-${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o "$RUNNER_TEMP/typos.tar.gz"
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos-extract"
          install "$RUNNER_TEMP/typos-extract/typos" "$RUNNER_TEMP/bin/typos"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/typos" --version

      - name: Spell check
        id: spellcheck
        if: always()
        run: |
          set -o pipefail
          if typos --config ./_typos.toml --format brief 2>&1 | tee /tmp/pr-checks/spellcheck-raw; then
            echo "passed" > /tmp/pr-checks/spellcheck-status
          else
            echo "failed" > /tmp/pr-checks/spellcheck-status
          fi

      # ── Check 2: Markdown lint ───────────────────────────
      - name: Markdown lint
        id: markdownlint
        if: always()
        run: |
          set -o pipefail
          if npx -y markdownlint-cli2 "README.md" "docs/**/*.md" 2>&1 | tee /tmp/pr-checks/markdownlint-output; then
            echo "passed" > /tmp/pr-checks/markdownlint-status
          else
            echo "failed" > /tmp/pr-checks/markdownlint-status
          fi

      # ── Check 3: YAML lint ───────────────────────────────
      - name: YAML lint
        id: yamllint
        if: always()
        run: |
          set -o pipefail
          if yamllint -c .yamllint.yml -f parsable mkdocs.yml mkdocs-ci.yml .github/workflows/ 2>&1 | tee /tmp/pr-checks/yamllint-output; then
            echo "passed" > /tmp/pr-checks/yamllint-status
          else
            echo "failed" > /tmp/pr-checks/yamllint-status
          fi

      # ── Check 4: Link check ──────────────────────────────
      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Link check
        id: linkcheck
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config .lychee.toml --format markdown README.md docs/**/*.md
          output: /tmp/pr-checks/linkcheck-output.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark link check status
        if: always()
        run: |
          if [ "$LINKCHECK_EXIT" = "0" ]; then
            echo "passed" > /tmp/pr-checks/linkcheck-status
          else
            echo "failed" > /tmp/pr-checks/linkcheck-status
          fi
        env:
          LINKCHECK_EXIT: ${{ steps.linkcheck.outputs.exit_code }}

      # ── Check 5: MkDocs build ────────────────────────────
      - name: MkDocs build
        id: mkdocs
        if: always()
        run: |
          set -o pipefail
          chmod +x scripts/docs_ci_check.sh
          if scripts/docs_ci_check.sh 2>&1 | tee /tmp/pr-checks/mkdocs-output; then
            echo "passed" > /tmp/pr-checks/mkdocs-status
          else
            echo "failed" > /tmp/pr-checks/mkdocs-status
          fi
          echo "status=$(cat /tmp/pr-checks/mkdocs-status)" >> "$GITHUB_OUTPUT"

      # The site just built goes to the preview job, which publishes it.
      # The offline plugin makes all links relative, so it works from a subfolder.
      - name: Upload the site for the preview
        id: preview_site
        if: always() && env.PREVIEW_ALLOWED == 'true' && steps.mkdocs.outputs.status == 'passed'
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview-site
          path: site/
          retention-days: 1

      # Links straight to the pages this PR changed, written with a {{PREVIEW}}
      # placeholder that pr-comment.yml fills in once the preview is online.
      - name: List the changed pages for the preview
        if: always() && steps.preview_site.outcome == 'success'
        run: |
          python3 - <<'PY'
          import os, subprocess, urllib.parse

          # The checkout is the merge commit: its first parent is the base branch.
          raw = subprocess.run(
              ["git", "diff", "--name-status", "-z", "-M", "HEAD^1", "HEAD"],
              capture_output=True, check=True,
          ).stdout.decode("utf-8", "replace").split("\0")
          changes, i = [], 0
          while i < len(raw) - 1:
              status = raw[i][:1]
              if status in "RC":
                  changes.append((status, raw[i + 2]))
                  i += 3
              else:
                  changes.append((status, raw[i + 1]))
                  i += 2

          def built(src):
              # With the offline plugin, docs/a/b.md is published as a/b.html.
              rel = src[len("docs/"):-len(".md")] + ".html"
              return rel if os.path.isfile(os.path.join("site", rel)) else None

          def label(text):
              return "".join(c for c in text if c not in "[]()<>`|*_")

          pages, notes, broad = {}, [], False
          for status, path in changes:
              if path == "README.md":
                  pages.setdefault("contribute.html", "Quick start (README.md)")
              elif path == "docs/contribute.md":
                  continue
              elif path.startswith("docs/") and path.endswith(".md"):
                  if status == "D":
                      notes.append(f"{label(path)} was deleted")
                  elif built(path):
                      pages.setdefault(built(path), label(path[len("docs/"):]) + (" (renamed)" if status == "R" else ""))
              elif path.startswith("includes/"):
                  for root, _, files in os.walk("docs"):
                      for name in sorted(files):
                          page = os.path.join(root, name)
                          if name.endswith(".md") and page != "docs/contribute.md":
                              with open(page, encoding="utf-8", errors="replace") as f:
                                  if path in f.read() and built(page):
                                      pages.setdefault(built(page), label(page[len("docs/"):]) + f" (uses {label(path)})")
              elif path.startswith(("docs/", "overrides/")) or path in ("mkdocs.yml", "mkdocs-ci.yml", "requirements.txt"):
                  broad = True

          lines, shown = [], list(pages.items())[:15]
          if shown:
              lines.append(">")
              lines.append("> Pages changed here:")
              for url, text in shown:
                  lines.append(f"> - [{text}]({{{{PREVIEW}}}}{urllib.parse.quote(url)})")
              if len(pages) > len(shown):
                  lines.append(f"> - and {len(pages) - len(shown)} more (see **Files changed**)")
          for note in notes:
              lines.append(f"> - {note}")
          if broad:
              lines.append(">")
              lines.append("> This pull request also changes settings, styles or scripts that can affect every page.")
          with open("/tmp/pr-checks/preview-pages.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + ("\n" if lines else ""))
          PY

      # ── Check 6: MkDocs Material syntax ─────────────────
      - name: MkDocs Material syntax check
        id: mkdocs_syntax
        if: always()
        run: |
          set -o pipefail
          if python3 scripts/check_mkdocs_syntax.py README.md docs/ 2>&1 | tee /tmp/pr-checks/mkdocs-syntax-output; then
            echo "passed" > /tmp/pr-checks/mkdocs-syntax-status
          else
            echo "failed" > /tmp/pr-checks/mkdocs-syntax-status
          fi

      # ── Check 7: Automation regression tests ────────────
      - name: Automation regression tests
        id: automation_tests
        if: always() && steps.changes.outputs.automation == 'true'
        run: |
          # Run every suite and fail if any of them fails (a single pipeline
          # would only report the exit status of the last one).
          OUT=/tmp/pr-checks/automation-tests-output
          : > "$OUT"
          rc=0
          bash tests/test_check_mkdocs_syntax.sh >> "$OUT" 2>&1 || rc=1
          bash tests/test_fix_markdown_table_pipes.sh >> "$OUT" 2>&1 || rc=1
          node tests/test-manage-docs-tags.js >> "$OUT" 2>&1 || rc=1
          cat "$OUT"
          if [ "$rc" -eq 0 ]; then
            echo "passed" > /tmp/pr-checks/automation-tests-status
          else
            echo "failed" > /tmp/pr-checks/automation-tests-status
          fi

      # ── Check 8: Workflow lint ──────────────────────────
      - name: Workflow lint
        id: workflow_lint
        if: always() && steps.changes.outputs.workflow == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          rm -rf "$RUNNER_TEMP/actionlint-extract"
          mkdir -p "$RUNNER_TEMP/actionlint-extract"
          ACTIONLINT_VERSION="1.7.12"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-extract"
          install "$RUNNER_TEMP/actionlint-extract/actionlint" "$RUNNER_TEMP/bin/actionlint"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          actionlint -version
          set -o pipefail
          # Without arguments actionlint checks every file in .github/workflows.
          if actionlint 2>&1 | tee /tmp/pr-checks/workflow-lint-output; then
            echo "passed" > /tmp/pr-checks/workflow-lint-status
          else
            echo "failed" > /tmp/pr-checks/workflow-lint-status
          fi

      # ── Assemble and post the report ─────────────────────
      - name: Build report
        if: always()
        env:
          # The head repository: for fork PRs the branch only exists there.
          EDIT_BASE: ${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name }}/edit/${{ github.head_ref }}
          PREVIEW_UPLOADED: ${{ steps.preview_site.outcome }}
          BUILD_STATUS: ${{ steps.mkdocs.outputs.status }}
          CHANGES_OUTCOME: ${{ steps.changes.outcome }}
          AUTOTESTS_EXPECTED: ${{ steps.changes.outputs.automation }}
          WFLINT_EXPECTED: ${{ steps.changes.outputs.workflow }}
        run: |
          REPORT="/tmp/pr-checks/report.md"

          # The preview job runs after this report. pr-comment.yml replaces the
          # block between the two markers with the links, or a note, once it
          # knows how that job ended.
          PREVIEW_NOTE=""
          if [ "$PREVIEW_UPLOADED" = "success" ]; then
            PREVIEW_NOTE="<!-- pr-preview -->
          $(cat /tmp/pr-checks/preview-pages.md 2>/dev/null)
          <!-- /pr-preview -->"
          elif [ "$PREVIEW_ALLOWED" = "true" ] && [ "$BUILD_STATUS" = "failed" ]; then
            PREVIEW_NOTE="> :no_entry: **No preview:** the site did not build. An older preview of this pull request was taken offline; a new one appears once the build passes."
          fi

          # Hidden marker so we can find and update this comment on future runs
          echo '<!-- pr-checks-report -->' > "$REPORT"


          # Checks that always run: no status file means the step did not run
          # (e.g. setup failed), which must not read as a pass.
          SPELL=$(cat /tmp/pr-checks/spellcheck-status 2>/dev/null || echo "missing")
          MDLINT=$(cat /tmp/pr-checks/markdownlint-status 2>/dev/null || echo "missing")
          YAML=$(cat /tmp/pr-checks/yamllint-status 2>/dev/null || echo "missing")
          LINKS=$(cat /tmp/pr-checks/linkcheck-status 2>/dev/null || echo "skipped")
          BUILD=$(cat /tmp/pr-checks/mkdocs-status 2>/dev/null || echo "missing")
          SYNTAX=$(cat /tmp/pr-checks/mkdocs-syntax-status 2>/dev/null || echo "missing")
          AUTOTESTS=$(cat /tmp/pr-checks/automation-tests-status 2>/dev/null || echo "skipped")
          WFLINT=$(cat /tmp/pr-checks/workflow-lint-status 2>/dev/null || echo "skipped")
          # Change detection decides which of these two run. If it failed, or a
          # check it asked for left no result, that must not read as skipped.
          if [ "$CHANGES_OUTCOME" != "success" ]; then
            AUTOTESTS=missing
            WFLINT=missing
          fi
          if [ "$AUTOTESTS_EXPECTED" = "true" ] && [ "$AUTOTESTS" = "skipped" ]; then
            AUTOTESTS=missing
          fi
          if [ "$WFLINT_EXPECTED" = "true" ] && [ "$WFLINT" = "skipped" ]; then
            WFLINT=missing
          fi

          # Where the bot can fix something itself, it suggests the fix on the line.
          FIX_NOTE=""
          if [ "$PREVIEW_ALLOWED" = "true" ]; then
            for c in "$SPELL" "$MDLINT" "$SYNTAX"; do
              if [ "$c" = "failed" ]; then
                FIX_NOTE="> :bulb: Where the bot knows the fix (spelling, spaces, quotes, blank lines), it suggests it on the line under **Files changed**: click **Commit suggestion** to apply it."
              fi
            done
          fi

          # Helper: clickable edit link for a file at a line number
          # Usage: edit_link "path/to/file" "42" → markdown link to GitHub edit view
          edit_link() {
            local filepath="$1"
            local lineno="$2"
            # Strip leading ./ if present
            filepath="${filepath#./}"
            if [ -n "$lineno" ]; then
              echo "[\`$filepath\` (line $lineno)]($EDIT_BASE/$filepath#L$lineno)"
            else
              echo "[\`$filepath\`]($EDIT_BASE/$filepath)"
            fi
          }

          # docs/contribute.md is generated from README.md, so send contributors
          # to the source file they actually need to edit.
          # MkDocs reports paths relative to docs/, so add the prefix the edit link needs.
          report_fix_target() {
            local filepath="$1"
            filepath="${filepath#./}"
            case "$filepath" in
              docs/*|README.md|"(unknown file)") ;;
              *) filepath="docs/$filepath" ;;
            esac
            if [ "$filepath" = "docs/contribute.md" ]; then
              echo "[\`README.md\` (sync source for \`docs/contribute.md\`)]($EDIT_BASE/README.md)"
            else
              edit_link "$filepath"
            fi
          }

          # Helper: status emoji
          emoji() {
            case "$1" in
              passed)  echo ":white_check_mark:" ;;
              failed|missing)  echo ":x:" ;;
              *)       echo ":white_circle:" ;;
            esac
          }

          # Link check emoji: warning instead of failure (advisory only)
          link_emoji() {
            case "$1" in
              passed)  echo ":white_check_mark:" ;;
              failed)  echo ":warning:" ;;
              *)       echo ":white_circle:" ;;
            esac
          }

          status_label() {
            case "$1" in
              passed) echo "Passed" ;;
              failed) echo "**Failed**" ;;
              missing) echo "**Did not run** (see the job log)" ;;
              skipped) echo "Skipped" ;;
              *) echo "$1" ;;
            esac
          }

          link_status_label() {
            case "$1" in
              passed) echo "Passed" ;;
              failed) echo "**Warning**" ;;
              skipped) echo "Skipped" ;;
              *) echo "$1" ;;
            esac
          }

          append_file_or_placeholder() {
            local filepath="$1"
            if [ -f "$filepath" ]; then
              cat "$filepath"
            else
              echo "(output not captured)"
            fi
          }

          # Count failures (link check is advisory — excluded from count)
          FAILURES=0
          for s in "$SPELL" "$MDLINT" "$YAML" "$BUILD" "$SYNTAX" "$AUTOTESTS" "$WFLINT"; do
            case "$s" in failed|missing) FAILURES=$((FAILURES + 1)) ;; esac
          done

          # ── All passed ──────────────────────────────────
          if [ "$FAILURES" -eq 0 ]; then
            cat >> "$REPORT" << EOF
          ## :white_check_mark: All checks passed

          Great job! Your changes look good.

          $PREVIEW_NOTE

          | Check | Status |
          |-------|--------|
          | Spell check | $(emoji "$SPELL") $(status_label "$SPELL") |
          | Markdown lint | $(emoji "$MDLINT") $(status_label "$MDLINT") |
          | YAML lint | $(emoji "$YAML") $(status_label "$YAML") |
          | Link check | $(link_emoji "$LINKS") $(link_status_label "$LINKS") |
          | MkDocs build | $(emoji "$BUILD") $(status_label "$BUILD") |
          | MkDocs syntax | $(emoji "$SYNTAX") $(status_label "$SYNTAX") |
          | Automation regression tests | $(emoji "$AUTOTESTS") $(status_label "$AUTOTESTS") |
          | Workflow lint | $(emoji "$WFLINT") $(status_label "$WFLINT") |

          A reviewer will take a look shortly.
          EOF
          else

          # ── Header with summary table ──────────────────
            cat >> "$REPORT" << EOF
          ## :mag: PR check results

          Some checks found issues that need your attention. Don't worry — most of these are easy to fix!

          $FIX_NOTE

          $PREVIEW_NOTE

          | Check | Status |
          |-------|--------|
          | Spell check | $(emoji "$SPELL") $(status_label "$SPELL") |
          | Markdown lint | $(emoji "$MDLINT") $(status_label "$MDLINT") |
          | YAML lint | $(emoji "$YAML") $(status_label "$YAML") |
          | Link check | $(link_emoji "$LINKS") $(link_status_label "$LINKS") |
          | MkDocs build | $(emoji "$BUILD") $(status_label "$BUILD") |
          | MkDocs syntax | $(emoji "$SYNTAX") $(status_label "$SYNTAX") |
          | Automation regression tests | $(emoji "$AUTOTESTS") $(status_label "$AUTOTESTS") |
          | Workflow lint | $(emoji "$WFLINT") $(status_label "$WFLINT") |

          Scroll down for details on each failed check and step-by-step instructions to fix them.
          EOF
          fi

          # ── Spell check section ─────────────────────────
          if [ "$SPELL" = "failed" ]; then
            {
              cat << 'EOF'

          ---

          ### :x: Spell check — possible typos

          The spell checker flagged these words:

          | Location | Found | Suggested fix |
          |----------|-------|---------------|
          EOF

              # Parse typos brief format: "file:line:col: error: `typo` should be `fix`"
              spell_rows_written=false
              if [ -f /tmp/pr-checks/spellcheck-raw ]; then
                while IFS= read -r line; do
                  # Use \x60 (backtick) to avoid shellcheck SC2016 false positives with literal backticks in regex.
                  # Match: filepath:line:col: error: `word` should be `correction`
                  if echo "$line" | grep -qP '.*:\d+:\d+:.*\x60.*\x60 should be \x60.*\x60'; then
                    file=$(echo "$line" | cut -d: -f1)
                    lineno=$(echo "$line" | cut -d: -f2)
                    typo=$(echo "$line" | awk -F'\x60' '{print $2}')
                    fix=$(echo "$line" | awk -F'\x60' '{print $4}')
                    spell_rows_written=true
                    echo "| $(edit_link "$file" "$lineno") | \`$typo\` | \`$fix\` |"
                  # Match without correction: filepath:line:col: error: `word`
                  elif echo "$line" | grep -qP '.*:\d+:\d+:.*\x60.*\x60'; then
                    file=$(echo "$line" | cut -d: -f1)
                    lineno=$(echo "$line" | cut -d: -f2)
                    typo=$(echo "$line" | awk -F'\x60' '{print $2}')
                    spell_rows_written=true
                    echo "| $(edit_link "$file" "$lineno") | \`$typo\` | *(check manually)* |"
                  fi
                done < /tmp/pr-checks/spellcheck-raw
              fi

              # Fallback: if no table rows were generated, show raw output
              if [ "$spell_rows_written" = "false" ]; then
                echo ""
                echo '```'
                append_file_or_placeholder /tmp/pr-checks/spellcheck-raw
                echo '```'
              fi

              cat << 'EOF'

          **How to fix:** open each file at the line shown and correct the spelling. On lines you changed in this pull request, the bot suggests the correction under **Files changed**: click **Commit suggestion** to apply it.

          <details>
          <summary>Is the word actually correct? (add it to the dictionary)</summary>

          If a flagged word is a real term, name, or abbreviation, add it to `_typos.toml` (case-sensitive) so it is not flagged again:
          ```toml
          [default.extend-words]
          YourWord = "YourWord"
          ```
          </details>
          EOF
            } >> "$REPORT"
          fi

          # ── Automation regression tests section ─────────
          if [ "$AUTOTESTS" = "failed" ]; then
            {
              cat << 'EOF'

          ---

          ### :x: Automation regression tests — repo support checks failed

          One or more tracked automation regression tests failed. These tests protect the helper scripts used by our workflows, so this usually means a recent workflow or script change broke repo automation behavior.

          **How to fix:**

          1. Re-run the same test entrypoints locally from the repo root:
             ```bash
             bash tests/test_check_mkdocs_syntax.sh
             bash tests/test_fix_markdown_table_pipes.sh
             node tests/test-manage-docs-tags.js
             ```
          2. Read the first failing test output below and fix the underlying script or fixture mismatch.
          3. Re-run the failing command locally before pushing again.

          <details>
          <summary>Full automation test output</summary>

          ```
          EOF
              append_file_or_placeholder /tmp/pr-checks/automation-tests-output
              cat << 'EOF'
          ```

          </details>
          EOF
            } >> "$REPORT"
          fi

          # ── Workflow lint section ───────────────────────
          if [ "$WFLINT" = "failed" ]; then
            {
              cat << 'EOF'

          ---

          ### :x: Workflow lint — GitHub Actions syntax or shell issues found

          `actionlint` found a problem in one or more workflow files. This usually means one of these:

          - invalid workflow syntax or unsupported keys
          - a bad action reference
          - shell script issues inside a `run:` block

          EOF
              if [ -f /tmp/pr-checks/workflow-lint-output ]; then
                echo "| Workflow file | Problem |"
                echo "|---------------|---------|"
                while IFS= read -r line; do
                  file="${line%%:*}"
                  problem="${line#*:}"
                  problem="${problem# }"
                  echo "| \`$file\` | $problem |"
                done < /tmp/pr-checks/workflow-lint-output
              fi

              cat << 'EOF'

          **How to fix:**

          1. Run `actionlint .github/workflows/*.yml` locally.
          2. If the message mentions a ShellCheck code such as `SC2001`, `SC2016`, or `SC2129`, fix the shell inside the relevant `run:` block rather than ignoring it.
          3. If the message mentions an action ref, key, or event, correct the workflow YAML and re-run `actionlint`.

          <details>
          <summary>Full workflow-lint output</summary>

          ```
          EOF
              append_file_or_placeholder /tmp/pr-checks/workflow-lint-output
              cat << 'EOF'
          ```

          </details>
          EOF
            } >> "$REPORT"
          fi

          # ── Markdown lint section ───────────────────────
          if [ "$MDLINT" = "failed" ]; then
            {
              cat << 'EOF'

          ---

          ### :x: Markdown lint — a few formatting fixes needed

          Open each file at the line shown and make the small change listed. That's all that's left to fix:

          EOF

              # Parse markdownlint output into a plain-language table. Format:
              # "file:line[:column] rule/name description" — the column is
              # omitted by whole-line rules like MD012/MD047. We translate the
              # common rules into one clear instruction; anything else falls
              # back to markdownlint's own description.
              if [ -f /tmp/pr-checks/markdownlint-output ]; then
                echo "| Where | What to change |"
                echo "|-------|----------------|"
                grep -E '^docs/.*:[0-9]+' /tmp/pr-checks/markdownlint-output | head -30 | while IFS= read -r line; do
                  file="${line%%:*}"
                  rest="${line#*:}"
                  lineno="${rest%% *}"
                  lineno="${lineno%%:*}"
                  raw="${rest#* }"
                  case "$raw" in
                    *MD009*) msg='Delete the leftover space(s) at the end of this line' ;;
                    *MD010*) msg='Replace the tab with spaces' ;;
                    *MD012*) msg='Remove the extra blank line — keep only one' ;;
                    *MD047*) msg='Add a single blank line at the very end of the file' ;;
                    *MD018*|*MD019*) msg='Use exactly one space after the # in this heading' ;;
                    *MD026*) msg='Remove the punctuation (like a period or colon) at the end of this heading' ;;
                    *MD024*) msg='Rename this heading — another heading already uses the same text' ;;
                    *MD003*) msg='Start this heading with # symbols, not = or - underlines' ;;
                    *MD001*) msg='Do not skip heading levels (## must follow #, not jump to ###)' ;;
                    *) msg="${raw//|/\\|}" ;;
                  esac
                  echo "| $(edit_link "$file" "$lineno") | $msg |"
                done
              fi

              cat << 'EOF'

          <details>
          <summary>More help: formatting cheat-sheet and full tool output</summary>

          | Common issue | How to fix it |
          |--------------|---------------|
          | Trailing spaces | Delete any spaces at the end of the line |
          | Multiple blank lines | Keep at most one blank line in a row |
          | Heading style | Start headings with `#`, not `===`/`---` underlines |
          | Heading spacing | Use one space after `#`, e.g. `## Title` |

          ```
          EOF
              append_file_or_placeholder /tmp/pr-checks/markdownlint-output
              cat << 'EOF'
          ```

          </details>
          EOF
            } >> "$REPORT"
          fi

          # ── YAML lint section ───────────────────────────
          if [ "$YAML" = "failed" ]; then
            {
              cat << 'EOF'

          ---

          ### :x: YAML lint — configuration file issues

          A YAML config file (like `mkdocs.yml`) has a formatting problem. Open each file at the line shown and fix it:

          EOF

              # Parse yamllint parsable output: "file:line:col: [level] message"
              if [ -f /tmp/pr-checks/yamllint-output ]; then
                echo "| Location | Problem |"
                echo "|----------|---------|"
                while IFS= read -r line; do
                  file=$(echo "$line" | cut -d: -f1)
                  lineno=$(echo "$line" | cut -d: -f2)
                  # Strip "file:line:col" and the following space.
                  msg="${line#*:}"
                  msg="${msg#*:}"
                  msg="${msg#*:}"
                  msg="${msg# }"
                  echo "| $(edit_link "$file" "$lineno") | $msg |"
                done < /tmp/pr-checks/yamllint-output
              fi

              cat << 'EOF'

          <details>
          <summary>YAML formatting help</summary>

          YAML is sensitive to formatting (spaces only, never tabs):

          | Issue | How to fix |
          |-------|-----------|
          | Wrong indentation | Use exactly 2 spaces per level |
          | Trailing spaces | Delete the spaces at the end of the line |
          | Too many blank lines | Keep at most one blank line in a row |
          | Line too long | Break it into multiple lines |
          </details>
          EOF
            } >> "$REPORT"
          fi

          # ── Link check section ─────────────────────────
          if [ "$LINKS" = "failed" ]; then
            {
              cat << 'EOF'

          ---

          ### :warning: Link check — potential issues found

          Some links may be broken or unreachable. Note that external sites sometimes block automated checks, so **verify the links below in your browser** before taking action.

          EOF
              append_file_or_placeholder /tmp/pr-checks/linkcheck-output.md
              cat << 'EOF'

          **How to fix:** For each broken link above:

          | Problem | How to fix |
          |---------|-----------|
          | **404 Not Found** | The page was removed or the URL changed — find the new URL and update the link |
          | **Timeout / connection error** | The website might be temporarily down — try opening the URL yourself. If it works, this is a false alarm and you can ignore it |
          | **Broken internal link** (e.g. `[text](../other-page.md)`) | The file you're linking to doesn't exist at that path — check the filename and folder structure |

          > **Note:** If a URL is correct but keeps getting flagged (e.g. the site blocks bots), you can add it to `.lychee.toml` under `exclude`:
          > ```toml
          > exclude = [
          >   "https://example.com/.*",
          > ]
          > ```
          EOF
            } >> "$REPORT"
          fi

          # ── MkDocs build section ───────────────────────
          if [ "$BUILD" = "failed" ]; then
            {
              cat << 'EOF'

          ---

          ### :x: MkDocs build — site failed to build

          The documentation site failed to compile. This means your changes can't be published until this is fixed.

          EOF

              # Extract and categorize MkDocs errors
              if [ -f /tmp/pr-checks/mkdocs-output ]; then
                # Check for "not in nav" errors
                if grep -q 'not included in the "nav"' /tmp/pr-checks/mkdocs-output; then
                  cat << 'EOF'

          **Missing from navigation:** You added a new page but forgot to register it.

          The following files need to be added to `mkdocs.yml` under the `nav:` section:

          EOF
                  awk '/not included in the "nav"/{flag=1;next}/^(INFO|WARNING|ERROR|DEBUG|\[)/{flag=0}flag && /\.md/{print "- `" $NF "`"}' /tmp/pr-checks/mkdocs-output
                  cat << 'EOF'

          <details>
          <summary>How to add a page to the nav</summary>

          Open `mkdocs.yml`, find the `nav:` section, and add your page in the right spot. For example:
          ```yaml
          nav:
            - Home: index.md
            - Research:
              - fMRI:
                - Your new page: research/fmri/your-new-page.md  # <-- add a line like this
          ```
          </details>
          EOF
                fi

                # Check for broken internal links / unresolved targets
                if grep -Eq "unrecognized relative link|contains a link '.*', but the target ('.*' )?is not found among documentation files|target not found" /tmp/pr-checks/mkdocs-output; then
                  cat << 'EOF'

          **Broken documentation links:** Some links point to pages MkDocs cannot resolve from the page being built.

          | Fix in | Reported in | Broken target |
          |--------|-------------|---------------|
          EOF
                  grep -E "unrecognized relative link|contains a link '.*', but the target ('.*' )?is not found among documentation files|target not found" /tmp/pr-checks/mkdocs-output | while IFS= read -r line; do
                    file=$(echo "$line" | grep -oP "Doc( file)? '\\K[^']+" | head -1)
                    link=$(echo "$line" | grep -oP "contains an unrecognized relative link '\\K[^']+" | head -1)
                    if [ -z "$link" ]; then
                      link=$(echo "$line" | grep -oP "contains a link '\\K[^']+" | head -1)
                    fi
                    if [ -z "$link" ]; then
                      link=$(echo "$line" | grep -oP "target '\\K[^']+" | head -1)
                    fi
                    [ -z "$file" ] && file="(unknown file)"
                    [ -z "$link" ] && link="(could not parse target)"
                    echo "| $(report_fix_target "$file") | \`$file\` | \`$link\` |"
                  done | awk '!seen[$0]++'
                  cat << 'EOF'

          <details>
          <summary>How to fix broken links</summary>

          1. Open the file in the first column and update the broken link target.
          2. If the "Reported in" file is `docs/contribute.md`, edit `README.md` instead — CI copies `README.md` into `docs/contribute.md`.
          3. In `README.md`, link to wiki pages with repo-root paths like `docs/contribute/admins.md`: `scripts/prepare_docs.sh` drops the `docs/` prefix in the `docs/contribute.md` copy.
          4. If the target page was renamed or moved, update the path to its new location.
          </details>
          EOF
                fi

                # Check for missing anchor errors
                if grep -Eq 'no such anchor|does not contain an anchor|but there is no such anchor on this page' /tmp/pr-checks/mkdocs-output; then
                  cat << 'EOF'

          **Broken anchor links:** Some links point to headings that do not exist on the target page.

          | Fix in | Reported in | Broken link |
          |--------|-------------|-------------|
          EOF
                  grep -E 'no such anchor|does not contain an anchor|but there is no such anchor on this page' /tmp/pr-checks/mkdocs-output | while IFS= read -r line; do
                    file=$(echo "$line" | grep -oP "Doc( file)? '\\K[^']+" | head -1)
                    link=$(echo "$line" | grep -oP "contains a link '\\K[^']+" | head -1)
                    if [ -z "$link" ]; then
                      link=$(echo "$line" | grep -oP "'[^']*#[^']+'" | head -1 | tr -d "'")
                    fi
                    [ -z "$file" ] && file="(unknown file)"
                    [ -z "$link" ] && link="(could not parse anchor)"
                    echo "| $(report_fix_target "$file") | \`$file\` | \`$link\` |"
                  done | awk '!seen[$0]++'
                  echo ''
                  cat << 'EOF'

          <details>
          <summary>How to fix broken anchors</summary>

          1. Open the file in the first column.
          2. Update the `#anchor` fragment so it matches the heading slug on the destination page.
          3. If reported in `docs/contribute.md`, edit `README.md` instead — `docs/contribute.md` is generated from it.
          </details>
          EOF
                fi
              fi

              # Always show full output in collapsed section
              cat << 'EOF'

          <details>
          <summary>Full build output</summary>

          ```
          EOF
              if grep -E '^(WARNING|ERROR|\[ERROR\]|\[docs-ci\])' /tmp/pr-checks/mkdocs-output >/dev/null 2>&1; then
                grep -E '^(WARNING|ERROR|\[ERROR\]|\[docs-ci\])' /tmp/pr-checks/mkdocs-output
              else
                append_file_or_placeholder /tmp/pr-checks/mkdocs-output
              fi
              cat << 'EOF'
          ```

          </details>
          EOF
            } >> "$REPORT"
          fi

          # ── MkDocs syntax section ───────────────────────
          if [ "$SYNTAX" = "failed" ]; then
            {
              cat << 'EOF'

          ---

          ### :x: MkDocs syntax — rendering issues detected

          Some MkDocs Material syntax issues were found that cause **silent rendering failures** (tabs not appearing, content falling outside admonitions, etc.).

          EOF

              if [ -f /tmp/pr-checks/mkdocs-syntax-output ]; then
                echo "| Location | Issue |"
                echo "|----------|-------|"
                grep -E '^docs/.*:[0-9]+:' /tmp/pr-checks/mkdocs-syntax-output | head -30 | while IFS= read -r line; do
                  file=$(echo "$line" | cut -d: -f1)
                  lineno=$(echo "$line" | cut -d: -f2)
                  # Strip "file:line" and the following space.
                  issue="${line#*:}"
                  issue="${issue#*:}"
                  issue="${issue# }"
                  echo "| $(edit_link "$file" "$lineno") | $issue |"
                done
              fi

              cat << 'EOF'

          On lines you changed, the bot suggests most of these fixes under **Files changed** (**Commit suggestion** applies one); anything else needs a manual fix.

          <details>
          <summary>How to fix each issue, with examples</summary>

          | Issue | How to fix |
          |-------|-----------|
          | Curly/smart quotes in a tab title | Replace them with straight `"..."` quotes |
          | Missing blank line after a tab header | Add an empty line between `=== "Title"` and the content |
          | Content not indented in a tab/admonition | Indent the content 4 spaces under the `===` or `!!!` marker |
          | Code block at column 0 | Indent the code to match the fence indentation |

          **Content tabs** — always leave a blank line after `===` and indent content by 4 spaces:
          ~~~markdown
          === "Tab Title"

              Content goes here, indented 4 spaces.

              ```bash
              code also indented 4 spaces
              ```
          ~~~

          **Admonitions** — indent content by 4 spaces (no blank line needed):
          ~~~markdown
          !!! note "Title"
              Content indented 4 spaces.
          ~~~

          **Admonition inside a tab** — content needs 4 + 4 = 8 spaces:
          ~~~markdown
          === "Setup"

              !!! warning
                  This text is indented 8 spaces (4 for the tab + 4 for the admonition).
          ~~~

          </details>
          EOF
            } >> "$REPORT"
          fi

          # ── Footer ─────────────────────────────────────
          if [ "$FAILURES" -gt 0 ]; then
            cat >> "$REPORT" << 'EOF'

          ---

          > :pushpin: **Need help?** Ping @costantinoai in the PR comments and I'll help you sort it out.
          >
          > Fix the items above and push — this comment updates automatically on the next commit.
          EOF
          fi

          echo "--- Report ---"
          cat "$REPORT"

      - name: Write report to job summary
        if: always()
        run: cat /tmp/pr-checks/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save PR metadata for comment workflow
        if: always()
        run: echo "$PR_NUMBER" > /tmp/pr-checks/pr-number.txt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-report
          path: |
            /tmp/pr-checks/report.md
            /tmp/pr-checks/pr-number.txt
          retention-days: 1

      # ── Final verdict ──────────────────────────────────
      - name: Fail if any check failed
        id: verdict
        if: always()
        env:
          CHANGES_OUTCOME: ${{ steps.changes.outcome }}
          AUTOTESTS_EXPECTED: ${{ steps.changes.outputs.automation }}
          WFLINT_EXPECTED: ${{ steps.changes.outputs.workflow }}
        run: |
          # Checks that always run: no status file means the step did not run
          # (e.g. setup failed), which must not read as a pass.
          SPELL=$(cat /tmp/pr-checks/spellcheck-status 2>/dev/null || echo "missing")
          MDLINT=$(cat /tmp/pr-checks/markdownlint-status 2>/dev/null || echo "missing")
          YAML=$(cat /tmp/pr-checks/yamllint-status 2>/dev/null || echo "missing")
          LINKS=$(cat /tmp/pr-checks/linkcheck-status 2>/dev/null || echo "skipped")
          BUILD=$(cat /tmp/pr-checks/mkdocs-status 2>/dev/null || echo "missing")
          SYNTAX=$(cat /tmp/pr-checks/mkdocs-syntax-status 2>/dev/null || echo "missing")
          AUTOTESTS=$(cat /tmp/pr-checks/automation-tests-status 2>/dev/null || echo "skipped")
          WFLINT=$(cat /tmp/pr-checks/workflow-lint-status 2>/dev/null || echo "skipped")
          # Change detection decides which of these two run. If it failed, or a
          # check it asked for left no result, that must not read as skipped.
          if [ "$CHANGES_OUTCOME" != "success" ]; then
            AUTOTESTS=missing
            WFLINT=missing
          fi
          if [ "$AUTOTESTS_EXPECTED" = "true" ] && [ "$AUTOTESTS" = "skipped" ]; then
            AUTOTESTS=missing
          fi
          if [ "$WFLINT_EXPECTED" = "true" ] && [ "$WFLINT" = "skipped" ]; then
            WFLINT=missing
          fi

          # Link check is advisory only — external sites may block CI runners.
          # Results still appear in the PR comment for manual review.
          if [ "$LINKS" = "failed" ]; then
            echo "::warning::Link check found issues — see the PR comment for details."
          fi

          if [ "$BUILD" = "failed" ]; then
            echo "::error::MkDocs build failed. See the PR comment for a parsed breakdown of missing nav entries, broken documentation links, and broken anchors."
            if grep -Eq "target not found|target ('.*' )?is not found|unrecognized relative link|does not contain an anchor|no such anchor|not included in the \"nav\"" /tmp/pr-checks/mkdocs-output 2>/dev/null; then
              grep -E "target not found|target ('.*' )?is not found|unrecognized relative link|does not contain an anchor|no such anchor|not included in the \"nav\"|^\\[ERROR\\]|^\\[docs-ci\\]" /tmp/pr-checks/mkdocs-output | head -40 || true
            fi
          fi

          FAILED=false
          for s in "$SPELL" "$MDLINT" "$YAML" "$BUILD" "$SYNTAX" "$AUTOTESTS" "$WFLINT"; do
            case "$s" in failed|missing) FAILED=true ;; esac
          done
          if [ "$FAILED" = "true" ]; then
            echo "verdict=failure" >> "$GITHUB_OUTPUT"
            echo "One or more checks failed. See the PR comment for details."
            exit 1
          fi
          echo "verdict=success" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────
  #  Job 2: Publish the built site as a preview of the PR
  # ───────────────────────────────────────────────────────────
  # The site goes to gh-pages under pr-preview/pr-<number>/; pr-preview-remove.yml
  # deletes it when the PR closes. This job runs no code from the pull request:
  # it only copies the pages built in check-and-report.
  preview:
    needs: check-and-report
    if: always() && needs.check-and-report.outputs.preview == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: "pr-preview-${{ github.event.pull_request.number }}"
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: pr-preview-site
          path: preview-site

      # Search engines must not index the previews, readers must see that a
      # preview is not the wiki, and visits must not count in the wiki's
      # statistics. The canonical link would point search engines at the live
      # page, which may not exist yet.
      - name: Mark the pages as a preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          BANNER="<div style=\"background:#b60205;color:#fff;text-align:center;padding:.4rem;font-size:.8rem\">Preview of <a style=\"color:#fff;text-decoration:underline\" href=\"$PR_URL\">pull request #$PR_NUMBER</a>. This is not the live wiki.</div>"
          find preview-site -name '*.html' -print0 | xargs -0 sed -i \
            -e 's|<head>|<head><meta name="robots" content="noindex">|' \
            -e 's|<link rel="canonical"[^>]*>||' \
            -e 's|function __md_analytics(){|function __md_analytics(){return;|' \
            -e "s|<body\([^>]*\)>|<body\1>$BANNER|"
          # Publish nothing unless every page got the marks.
          TOTAL=$(find preview-site -name '*.html' | wc -l)
          ROBOTS=$(grep -rlF --include='*.html' '<meta name="robots" content="noindex">' preview-site | wc -l)
          BANNERS=$(grep -rlF --include='*.html' 'This is not the live wiki.' preview-site | wc -l)
          echo "$TOTAL pages, $ROBOTS with noindex, $BANNERS with the banner."
          if [ "$TOTAL" -eq 0 ] || [ "$ROBOTS" -ne "$TOTAL" ] || [ "$BANNERS" -ne "$TOTAL" ]; then
            echo "::error::Some preview pages lack the noindex tag or the banner; not publishing."
            exit 1
          fi

      - name: Find the Pages address
        id: pages
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          echo "base=${OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Deploy the preview
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          source-dir: preview-site
          action: deploy
          pages-base-url: ${{ steps.pages.outputs.base }}
          # The check report already links the preview.
          comment: false

  # ───────────────────────────────────────────────────────────
  #  Job 3: Take an outdated preview offline
  # ───────────────────────────────────────────────────────────
  # When a push breaks the build there is no new preview, and the old one no
  # longer matches the pull request: remove it so nobody reviews stale pages.
  preview-remove-stale:
    needs: check-and-report
    if: >-
      always() && needs.check-and-report.outputs.build == 'failed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: "pr-preview-${{ github.event.pull_request.number }}"
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Find the Pages address
        id: pages
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          echo "base=${OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Remove the preview
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          action: remove
          pages-base-url: ${{ steps.pages.outputs.base }}
          comment: false

  # ───────────────────────────────────────────────────────────
  #  Job 4: One-click fixes
  # ───────────────────────────────────────────────────────────
  # Runs the safe fixes (table pipes, Markdown spacing, quotes and blank lines
  # in tab and box titles, YAML trailing spaces, spellings typos is sure of) on
  # a copy of the PR and posts each change as a review suggestion on the lines
  # the PR added; "Commit suggestion" applies it. Nothing is pushed: every
  # commit is checked by its own run of check-and-report. The fix scripts come
  # from the base branch, so the PR cannot change what runs with this token.
  suggest-fixes:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Check out the fix scripts from the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The same version as the spell check above.
      - name: Install typos
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/typos-extract"
          TYPOS_VERSION="v1.43.5"
          curl -fsSL "https://github.com/crate-ci/typos/releases/download/${TYPOS_VERSION}/typos-${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o "$RUNNER_TEMP/typos.tar.gz"
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos-extract"
          install "$RUNNER_TEMP/typos-extract/typos" "$RUNNER_TEMP/bin/typos"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Each fixer changes only the working tree; the next step turns the
      # difference into suggestions. typos --write-changes applies only
      # corrections it is sure of.
      - name: Apply the safe fixes to the working tree
        working-directory: pr
        run: |
          python3 ../trusted/scripts/fix_markdown_table_pipes.py README.md docs/ || true
          npx -y markdownlint-cli2 "README.md" "docs/**/*.md" --fix || true
          python3 ../trusted/scripts/check_mkdocs_syntax.py --fix README.md docs/ || true
          sed -i 's/[[:space:]]*$//' mkdocs.yml mkdocs-ci.yml .yamllint.yml .github/workflows/*.yml 2>/dev/null || true
          typos --config ./_typos.toml --write-changes || true
          git status --short

      - name: Post the fixes as suggestions
        uses: reviewdog/action-suggester@v1.26.3
        with:
          path: pr
          tool_name: Fix
          filter_mode: added
