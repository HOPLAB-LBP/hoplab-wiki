theme:
  name: material
  custom_dir: overrides # partials/source-file.html: contributors with avatars and shares
  logo: assets/thicker_white_brain.svg
  favicon: assets/hoplab_favicon_white.ico
  icon:
    repo: fontawesome/brands/github

  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.action.edit
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    # - navigation.expand
    # - navigation.sections  # off: sidebar sections are collapsed and expand on click
    # - toc.integrate # (1)!
    - search.highlight
    - search.suggest
    - search.share
    - navigation.indexes
    - navigation.footer

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 2 # This controls how many sub-headers are included in the toc
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - admonition
  - meta
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.striphtml
  - pymdownx.magiclink
  - pymdownx.progressbar
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

plugins:
  - offline
#  - privacy
  - search
  # Click an image to see it large, in front of the page (lightbox). Emoji and images
  # inside a link are left alone; add { .off-glb } to an image to keep it out.
  - glightbox:
      effect: zoom
      slide_effect: slide
      zoomable: false   # zoom with the slider bar instead (javascripts/lightbox-zoom.js)
      draggable: false  # mouse drag pans a zoomed image; arrows, keys and swipes change image
      touchNavigation: true
      loop: false
      skip_classes:
        - off-glb
  # The git-based page footer (last update, contributors) is added in mkdocs-ci.yml,
  # so a local `mkdocs serve` needs no git. Preview it with: mkdocs serve -f mkdocs-ci.yml

extra_css:
  - stylesheets/extra.css
  - stylesheets/resource-cards.css
  - stylesheets/visual-angle.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/details.js
  - javascripts/lightbox-zoom.js # zoom slider for the image lightbox
  - javascripts/source-file.js # footer: last update in the reader's time zone
  - javascripts/visual-angle.js # visual angle calculator (fMRI equipment and EEG task pages)
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  consent:
    title: Cookie consent
    description: >-
      Please, consider disabling your ad-blocker and allowing cookies for this Wiki .
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
  analytics:
    provider: google
    property: G-71T36SYGT2
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            opening a new <a href="https://github.com/HOPLAB-LBP/hoplab-wiki/issues/new/?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">Issue</a>, or contact a Wiki manager.

copyright: >
  <a href="#__consent">Change cookie settings</a>
